<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Outsourcing — Monday morning</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600&family=Spline+Sans+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="motion.css">
<style>
  /* The outsourcing slot as one week on the client's own board (script chosen
     by the client 2026-10-14, "Monday morning"):

       1  Monday, 9:00.            the backlog fills: 15 tickets, 8 more arrive
       2  Three more engineers.    three avatars join *their* board and take tickets
       3  Tickets move.            To do → In progress → Done; VPN for a new hire
                                   closes in 14 minutes
       4  Friday, 17:00.           the clock rolls, the backlog drains 23 → 4
       5  Your board. Your process. More hands.

     The board is a list of states. Each event (a drop, a move) produces the
     next state; a card's position is an ease between where the previous state
     put it and where this one does — so columns reshuffle instead of jumping.
     Names, initials and tickets are fictional. */

  #board{left:96px;top:232px;width:1408px;height:696px;padding:28px 40px}
  #board .name{font-size:60px}
  #clock{position:absolute;right:40px;top:24px;text-align:right}
  #clock .d{font-family:var(--mono);font-size:22px;letter-spacing:.2em;color:var(--ink-mid)}
  #clock .h{font-family:var(--display);font-weight:600;font-size:84px;line-height:1;color:var(--ink-hi);font-variant-numeric:tabular-nums}
  #team{position:absolute;left:490px;top:44px;display:flex;align-items:center;gap:12px}
  #team .lbl{font-family:var(--mono);font-size:18px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-mid);margin-right:8px}
  .av{width:58px;height:58px;border-radius:50%;background:var(--av);color:var(--ink-hi);display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:19px;font-weight:500;flex:none}
  .av.new{background:var(--accent);color:#04203a;box-shadow:0 0 0 4px var(--av-ring)}

  .col{position:absolute;top:150px;width:428px;height:518px;border-radius:12px;background:var(--surf)}
  .colh{position:absolute;left:18px;right:18px;top:12px;display:flex;align-items:baseline;justify-content:space-between}
  .colh span{font-family:var(--mono);font-size:23px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-mid)}
  .colh b{font-family:var(--display);font-weight:600;font-size:44px;color:var(--ink-hi);font-variant-numeric:tabular-nums}

  .tk{position:absolute;left:0;top:0;width:400px;height:66px;border-radius:10px;background:var(--tile);border:2px solid var(--tile-edge);
    padding:0 16px;display:flex;align-items:center;gap:14px;z-index:2}
  .tk .key{display:none}  /* ticket numbers mean nothing to a lay viewer; the title gets the room */
  .tk .tt{font-family:var(--sans);font-weight:500;font-size:27px;color:var(--ink-hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  .tk .bd{display:none;width:34px;height:34px;border-radius:50%;background:var(--accent);color:#04203a;font-family:var(--mono);font-size:13px;
    font-weight:500;display:flex;align-items:center;justify-content:center;flex:none;opacity:0}
  .tk .tm{font-family:var(--mono);font-size:16px;font-weight:500;background:var(--chip);color:var(--chip-ink);border-radius:6px;padding:3px 8px;flex:none;opacity:0;display:none}
  .tk.done .tt{color:var(--ink-mid);text-decoration:line-through;text-decoration-color:var(--mute-fill)}
  .more{position:absolute;font-family:var(--mono);font-size:19px;color:var(--ink-mid);border:2px dashed var(--line);border-radius:10px;
    width:400px;height:52px;display:flex;align-items:center;justify-content:center;letter-spacing:.06em;z-index:3;background:var(--surf)}
  #assign{position:absolute;inset:0;width:1600px;height:1067px;z-index:3;pointer-events:none}
  .cards-light #assign line{stroke:var(--accent)}
</style></head>
<body>
<div class="field"></div>
<div class="tris" id="tris"></div>

<div id="cam">
  <div class="card" id="board">
    <div class="hdr"><span class="kind" data-cs="IT požadavky vaší firmy">Your company&rsquo;s IT requests</span></div>
    <div class="name" data-cs="Tento týden">This week</div>
    <div id="team"><span class="lbl" data-cs="tým">team</span>
      <span class="av">JK</span><span class="av">MP</span>
      <span class="av new" id="a0">TS</span><span class="av new" id="a1">RV</span><span class="av new" id="a2">LD</span>
    </div>
    <div id="clock"><div class="d" id="day">MON</div><div class="h" id="hm">09:00</div></div>
    <div class="col" style="left:40px"><div class="colh"><span data-cs="Čeká">Waiting</span><b id="c0">15</b></div></div>
    <div class="col" style="left:490px"><div class="colh"><span data-cs="Řeší se">Being solved</span><b id="c1">1</b></div></div>
    <div class="col" style="left:940px"><div class="colh"><span data-cs="Hotovo">Done</span><b id="c2">1</b></div></div>
  </div>
  <div id="cards"></div>
  <div class="more" id="m0"></div><div class="more" id="m1"></div><div class="more" id="m2"></div>
  <svg id="assign" viewBox="0 0 1600 1067"></svg>
</div>

<div class="cap"><div class="mask"><span data-cs="Pondělí 9:00. Požadavky přibývají.">Monday 9:00. Requests pile up.</span></div></div>
<div class="cap"><div class="mask"><span data-cs="Přidáme vám tři odborníky.">We add three experts to your team.</span></div></div>
<div class="cap"><div class="mask"><span data-cs="Požadavky se řeší.">Requests get solved.</span></div></div>
<div class="cap"><div class="mask"><span data-cs="Pátek 17:00. Skoro hotovo.">Friday 17:00. Almost clear.</span></div></div>

<div id="payoff">
  <div class="mask"><span data-cs="Váš <s>tým.</s>">Your <s>team.</s></span></div>
  <div class="mask"><span data-cs="Naši <s>odborníci.</s>">Our <s>experts.</s></span></div>
  <div class="mask"><span data-cs="Méně <s>čekání.</s>">Less <s>waiting.</s></span></div>
</div>

<div class="chapters" id="chapters"><i><b></b></i><i><b></b></i><i><b></b></i><i><b></b></i><i><b></b></i></div>

<script src="motion.js"></script>
<script>
const DURATION = 26;
const SCENES = [[0, 5.4], [5.4, 10.4], [10.4, 17.0], [17.0, 22.6], [22.6, 26]];
const CAPS = [[0.4, 5.0], [5.7, 10.0], [10.7, 16.6], [17.3, 22.2]];

/* ---------- tickets (fictional) ---------- */
// Plain, recognisable office problems — the viewer is not an IT person.
const NAMED = tr([
  ["#231", "Access for newcomer"], ["#232", "Printer won't print"], ["#088", "Wi-Fi keeps dropping"],
  ["#017", "Server running full"], ["#233", "Can't log in"], ["#234", "3 new laptops"],
  ["#089", "Slow internet"], ["#018", "Security update"],
  ["#220", "Shared folder"], ["#219", "New email account"],
], [
  ["#231", "Přístup pro nováčka"], ["#232", "Tiskárna netiskne"], ["#088", "Padá Wi-Fi"],
  ["#017", "Server se plní"], ["#233", "Nejde přihlásit"], ["#234", "3 nové notebooky"],
  ["#089", "Pomalý internet"], ["#018", "Bezpečnostní update"],
  ["#220", "Sdílená složka"], ["#219", "Nový e-mail"],
]);
const GENERIC = tr(["Mailbox full", "No sound in calls", "Licence renewal", "Door badge", "Screen flickers", "Remote access",
  "Shared calendar", "Password expired", "Scanner to email", "Phone setup", "New software", "Backup check",
  "Access review", "Folder rights", "Docking station"],
  ["Plná schránka", "Nejde zvuk v hovoru", "Obnova licence", "Karta na dveře", "Bliká monitor", "Vzdálený přístup",
  "Sdílený kalendář", "Vypršelo heslo", "Skener do e-mailu", "Nastavit telefon", "Nový program", "Kontrola zálohy",
  "Kontrola přístupů", "Práva ke složce", "Dokovací stanice"]).map((tt, i) => [`#${200 + i}`, tt]);
const TICKETS = NAMED.concat(GENERIC);           // ids 0..9 named, 10..24 generic
const G = (i) => 10 + i;

/* ---------- board geometry (canvas coords) ---------- */
const BX = 96, BY = 232;
const COL_X = [40, 490, 940].map((x) => BX + x + 14);
const SLOT_Y = (s) => BY + 150 + 64 + s * 78;
const VISIBLE = 5;
// The "+N more" box sits one gap under the last visible ticket; the column
// (518px) and the board (696px) are sized to hold it with the same 12px gap.
const MORE_Y = SLOT_Y(VISIBLE);
// New tickets appear in place at the top of the column (a gentle scale-in, no
// lift): any spawn point above it made them fade through the column title.
const SPAWN = { x: COL_X[0], y: SLOT_Y(0) };

/* ---------- events: each one is a list of [ticket, column] moves ----------
   Column 0 To do, 1 In progress, 2 Done. A move puts the ticket at the top
   of its new column. */
const DROP = [7, 6, 5, 4, 3, 2, 1, 0];
const EVENTS = [
  ...DROP.map((id, k) => [1.6 + k * 0.42, [[id, 0]]]),
  [10.8, [[0, 1]]], [11.5, [[3, 1]]], [12.2, [[2, 1]]],
  [12.9, [[8, 2]]], [13.6, [[0, 2]]], [14.3, [[3, 2]]], [15.0, [[1, 1]]], [15.7, [[2, 2]]], [16.4, [[1, 2]]],
  // Friday montage: batches drain the backlog
  [17.5, [[4, 2], [G(0), 2], [G(1), 2], [5, 1]]],
  [18.1, [[6, 2], [G(2), 2], [G(3), 2], [G(4), 2]]],
  [18.7, [[7, 2], [5, 2], [G(5), 2], [G(6), 2]]],
  [19.3, [[G(7), 2], [G(8), 2], [G(9), 2], [G(10), 1]]],
];
const MOVE = 0.55;   // ease length; events are spaced ≥ 0.6 apart, the drops 0.42 (they only slide down)

// state 0: Monday before the drops
const S0 = [[...Array(15)].map((_, i) => G(i)), [8], [9]];
const STATES = [S0];
EVENTS.forEach(([, moves]) => {
  const prev = STATES[STATES.length - 1].map((c) => c.slice());
  for (const [id, to] of moves) {
    prev.forEach((c) => { const k = c.indexOf(id); if (k >= 0) c.splice(k, 1); });
    prev[to].unshift(id);
  }
  STATES.push(prev);
});
const posIn = (state, id) => {
  for (let c = 0; c < 3; c++) {
    const k = state[c].indexOf(id);
    // Past the last visible slot a ticket tucks in behind the "+N more" box
    // (centred on it, so nothing pokes out of the column) and fades.
    if (k >= 0) return { x: COL_X[c], y: k < VISIBLE ? SLOT_Y(k) : MORE_Y - 7, o: k < VISIBLE ? 1 : 0, col: c };
  }
  return { x: SPAWN.x, y: SPAWN.y, o: 0, col: -1 };
};

/* assigned engineers */
const ASSIGN = [[0, 0, 7.6], [1, 3, 8.15], [2, 2, 8.7], [1, 1, 15.0]];   // [avatar, ticket, time]
const INITIALS = ["TS", "RV", "LD"];

/* ---------- setup ---------- */
triangles($("tris"), TRIS);
$("cards").innerHTML = TICKETS.map(([k, tt]) =>
  `<div class="tk"><span class="key">${k}</span><span class="tt">${tt}</span><span class="tm">14 min</span><span class="bd"></span></div>`).join("");
const cardEls = [...$("cards").children];
const caps = [...document.querySelectorAll(".cap .mask > span")];
const pay = [...document.querySelectorAll("#payoff .mask > span")];
const avs = [0, 1, 2].map((i) => $("a" + i));
const AV_HOME = avs.map((a) => { const r = a.getBoundingClientRect(); return { x: r.x + r.width / 2, y: r.y + r.height / 2 }; });

const camAt = camera([
  [0, 0, 0, 1], [5.2, 0, 0, 1.02],
  // Push on the board centre, framed so the board stays clear of the caption
  // above and the chapter ticks below.
  [6.0, ...focus({ x: 800, y: 569 }, { x: 800, y: 580 }, 1.06)], [9.6, ...focus({ x: 800, y: 569 }, { x: 800, y: 580 }, 1.06)],
  [10.5, 0, 0, 1], [16.8, 0, 0, 1.02], [17.2, 0, 0, 1], [22.2, 0, 0, 1.03], [26, 0, 0, 1],
]);

const fmt = (n) => String(n).padStart(2, "0");
const DAYS = tr(["MON", "TUE", "WED", "THU", "FRI"], ["PO", "ÚT", "ST", "ČT", "PÁ"]);

/* ---------- the frame ---------- */
function draw(t) {
  drift($("tris"), t, DURATION);
  const [cx, cy, cs] = camAt(t);
  $("cam").style.transform = `translate(${cx}px, ${cy}px) scale(${cs})`;
  chapters($("chapters"), SCENES, t, DURATION);
  captions(caps, CAPS, t);

  const bIn = out(span(t, 0.4, 1.2));
  const bOut = inOut(span(t, 22.2, 22.6));
  const vis = bIn * (1 - bOut);
  $("board").style.opacity = vis;
  $("board").style.transform = `translateY(${(1 - bIn) * 40}px) scale(${1 - 0.04 * bOut})`;

  // which state are we in, and how far into the move towards it
  let k = 0;
  while (k < EVENTS.length && t >= EVENTS[k][0]) k++;
  const cur = STATES[k], prev = STATES[Math.max(0, k - 1)];
  const p = k === 0 ? 1 : inOut(span(t, EVENTS[k - 1][0], EVENTS[k - 1][0] + MOVE));
  // Inside a batch each card leaves 0.14s after the one before, so a batch
  // reads as a flurry rather than four cards stacked on one path.
  const order = new Map(k ? EVENTS[k - 1][1].map(([id], j) => [id, j]) : []);
  const e0 = k ? EVENTS[k - 1][0] : 0;

  TICKETS.forEach((_, id) => {
    const el = cardEls[id];
    const a = posIn(prev, id), b = posIn(cur, id);
    const q = order.has(id) ? inOut(span(t, e0 + order.get(id) * 0.14, e0 + order.get(id) * 0.14 + MOVE)) : p;
    const arriving = a.col === -1;
    // A new ticket waits for the one below to make room, then fades in: started
    // together, the two sat on top of each other in the top slot.
    const qa = arriving ? inOut(span(q, 0.7, 1)) : q;
    const lift = order.has(id) && !arriving ? Math.sin(Math.PI * q) : 0;
    const x = lerp(a.x, b.x, q), y = lerp(a.y, b.y, q) - lift * 30;
    el.style.transform = `translate(${x}px, ${y + (1 - bIn) * 40}px) scale(${(1 + 0.05 * lift) * (arriving ? 0.92 + 0.08 * qa : 1)}) rotate(${lift * (b.x > a.x ? 2 : 0)}deg)`;
    // one sliding out of view is gone by half-way, before it reaches the box
    const leaving = a.o === 1 && b.o === 0;
    el.style.opacity = (leaving ? 1 - span(q, 0, 0.5) : lerp(a.o, b.o, qa)) * vis;
    el.style.zIndex = lift > 0 ? 5 : 2;
    // a lifted ticket casts a shadow; lighter on the white cards
    el.style.boxShadow = lift > 0 ? `0 ${20 * lift}px ${40 * lift}px rgba(0,8,24,${(CARDS === "light" ? 0.22 : 0.55) * lift})` : "none";
    el.classList.toggle("done", b.col === 2 && q > 0.6);
    // VPN for the new hire closes in 14 minutes
    const tm = el.querySelector(".tm");
    const tmo = id === 0 ? out(span(t, 13.8, 14.2)) : 0;
    tm.style.opacity = tmo;
    tm.style.display = tmo > 0 ? "block" : "none";
  });
  const lerpN = (c) => lerp(prev[c].length, cur[c].length, p);
  [0, 1, 2].forEach((c) => {
    $("c" + c).textContent = Math.round(lerpN(c));
    // Counted from the same eased total as the header, so the two never
    // disagree mid-move: the box ticks up as a ticket slides in behind it.
    const n = Math.round(lerpN(c)) - VISIBLE;
    const m = $("m" + c);
    m.textContent = tr(`+${Math.max(0, n)} more`, `+${Math.max(0, n)} dalších`);
    m.style.transform = `translate(${COL_X[c]}px, ${MORE_Y + (1 - bIn) * 40}px)`;
    m.style.opacity = (n > 0 ? 1 : 0) * vis;
  });

  /* ---- engineers join ---- */
  avs.forEach((a, i) => {
    const q = back(span(t, 5.9 + i * 0.4, 6.5 + i * 0.4));
    a.style.transform = `translate(${(1 - clamp(q)) * 520}px, 0) scale(${0.6 + 0.4 * q})`;
    a.style.opacity = clamp(q * 1.5);
  });
  // assignment: a line from the avatar to the ticket, then a badge on the card
  let lines = "";
  ASSIGN.forEach(([ai, id, s]) => {
    const badge = cardEls[id].querySelector(".bd");
    badge.textContent = INITIALS[ai];
    const bq = back(span(t, s + 0.35, s + 0.7));
    badge.style.opacity = clamp(bq * 2);
    badge.style.display = t >= s + 0.35 ? "flex" : "none";
    badge.style.transform = `scale(${0.4 + 0.6 * bq})`;
    const d = out(span(t, s, s + 0.4)), f = 1 - span(t, s + 0.6, s + 0.9);
    if (d > 0 && f > 0) {
      const from = AV_HOME[ai];
      const pos = posIn(cur, id);
      const to = { x: pos.x + 400 - 33, y: pos.y + 33 };
      lines += `<line x1="${from.x}" y1="${from.y + 30}" x2="${lerp(from.x, to.x, d)}" y2="${lerp(from.y + 30, to.y, d)}" stroke="#fff" stroke-width="4" stroke-dasharray="10 8" opacity="${f}"/>`;
    }
  });
  $("assign").innerHTML = lines;

  /* ---- the week goes by ---- */
  const roll = inOut(span(t, 17.3, 19.6));
  const mins = 9 * 60 + roll * (4 * 24 * 60 + 8 * 60);
  $("day").textContent = DAYS[Math.min(4, Math.floor(mins / (24 * 60)))];
  $("hm").textContent = `${fmt(Math.floor(mins / 60) % 24)}:${fmt(Math.floor(mins % 60))}`;

  /* ---- payoff ---- */
  pay.forEach((s, i) => mask(s, span(t, 22.75 + i * 0.25, 23.4 + i * 0.25), span(t, 25.2 + i * 0.1, 25.7 + i * 0.1)));
}
const lerp = (a, b, p) => a + (b - a) * p;

paced(draw, DURATION, 1);
</script>
</body></html>
