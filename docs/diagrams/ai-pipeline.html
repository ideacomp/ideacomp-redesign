<!doctype html><html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600&family=Spline+Sans+Mono:wght@400&display=swap">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1600px;height:1067px;background:#141a22;overflow:hidden;position:relative}
  .grid{position:absolute;inset:0;
    background-image:radial-gradient(#2b3540 2px,transparent 2px);
    background-size:44px 44px;background-position:12px 12px}
  svg{position:absolute;inset:0;width:1600px;height:1067px;pointer-events:none}
  .node{position:absolute;width:372px;background:#1d252f;border:2px solid #3f4a57;
    border-radius:10px;padding:20px 24px 18px}
  .kind{font-family:'Spline Sans Mono',monospace;font-size:15px;letter-spacing:.17em;
    text-transform:uppercase;color:#93a0ad}
  .name{font-family:'Big Shoulders Display',sans-serif;font-weight:600;font-size:44px;
    line-height:1.0;letter-spacing:-.012em;color:#f2f5f8;margin-top:7px}
  .meta{font-family:'Spline Sans Mono',monospace;font-size:15px;color:#8f9ca9;margin-top:9px}
  .pill{display:inline-block;font-family:'Spline Sans Mono',monospace;font-size:13px;
    letter-spacing:.12em;text-transform:uppercase;border:2px solid #3f8fa6;border-radius:999px;
    padding:3px 12px;color:#7fd0e8;margin-top:11px}
  .port{position:absolute;width:16px;height:16px;border-radius:50%;background:#1d252f;
    border:2px solid #5f93a6;z-index:2}
  .port.l{left:-9px;top:50%;margin-top:-8px}
  .port.r{right:-9px;top:50%;margin-top:-8px}
  .port.t{top:-9px;left:50%;margin-left:-8px}
  .port.b{bottom:-9px;left:50%;margin-left:-8px}
  .title{position:absolute;left:64px;top:56px;font-family:'Spline Sans Mono',monospace;
    font-size:18px;letter-spacing:.2em;text-transform:uppercase;color:#9dabb7}
  .rule{position:absolute;left:64px;top:94px;width:170px;height:3px;background:#36c3e7}
  .foot{position:absolute;left:64px;bottom:56px;font-family:'Spline Sans Mono',monospace;
    font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:#6d7b88}
</style></head><body>
<div class="grid"></div>
<svg id="wires" viewBox="0 0 1600 1067"></svg>

<div class="title">Inference pipeline</div>
<div class="rule"></div>
<div class="foot">every output traceable to its inputs</div>

<div class="node" id="n1" style="left:64px;top:248px">
  <div class="kind">Trigger</div><div class="name">Operational data</div>
  <div class="meta">batch + stream</div><span class="port r"></span>
</div>
<div class="node" id="n2" style="left:560px;top:248px">
  <div class="kind">Transform</div><div class="name">Validate &amp; enrich</div>
  <div class="meta">schema + drift check</div><span class="port l"></span><span class="port r"></span><span class="port b"></span>
</div>
<div class="node" id="n3" style="left:1056px;top:232px">
  <div class="kind">Model</div><div class="name">Forecast</div>
  <div class="meta">versioned</div><span class="pill">explainable</span>
  <span class="port l"></span><span class="port b"></span>
</div>
<div class="node" id="n4" style="left:560px;top:628px">
  <div class="kind">Guardrail</div><div class="name">Human review</div>
  <div class="meta">override available</div><span class="port t"></span><span class="port r"></span>
</div>
<div class="node" id="n5" style="left:1056px;top:628px">
  <div class="kind">Output</div><div class="name">Decision</div>
  <div class="meta">auditable</div><span class="port l"></span><span class="port t"></span>
</div>
</body></html>
